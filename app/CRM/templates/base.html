<!DOCTYPE html> 
{% load static %}
<html>
    <head>
<link rel="stylesheet" href="{% static 'style.css' %}">
<script src="{% static 'js/script.js'%}"></script>
    </head>
<body>
<h1>CRM</h1>
 <nav class="sidebar">
  <div class="sidebar-header">CRM</div>
  <div class="nav-group">
<a class="nav-item"href="{% url 'DB' %}">DB</a>
<a class="nav-item"href="{% url 'Transactions'%}">Transactions</a>
<a class="nav-item"href="{% url 'Stock'%}">Stock</a>
  </div>
  <div class="sidebar-footer">
    <div class="user-profile">
      <div class="user-avatar"></div>
      {% if user.is_authenticated %}
  
  <form action="{% url 'LogOut' %}" method="post">
    {% csrf_token %}
    <button type="submit">LogOut</button>
  </form>
{% else %}
      <span><a class="nav-item"href="{%url 'LogIn' %}">Log In</a></span>
{% endif %}
    </div>
  </div>
{% if user.is_staff %}
    <a href="{% url 'admin:index' %}" class="style-as-button">
        Admin Dashboard
    </a>
{% endif %}
</nav>
<ul id="nav">

  <li></li>
    <li></li>
  <li></li>
</ul>
<div class="container">
{% block head %}

{% endblock %}

</div>



</body>
</html>
